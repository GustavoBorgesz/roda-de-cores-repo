name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type-check and compile TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify compiled JS matches committed JS
        run: |
          if ! git diff --quiet -- app.js colorMath.js; then
            echo "::error::app.js/colorMath.js estão desatualizados em relação a src/*.ts."
            echo "Rode 'npm run build' localmente e comite o resultado."
            git diff --stat -- app.js colorMath.js
            exit 1
          fi
