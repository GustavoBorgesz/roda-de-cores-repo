<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roda de Cores</title><link rel="stylesheet" href="style.css"></head><body><main><header><span>TEORIA DAS CORES</span><h1>Roda de Cores Interativa</h1><p>Explore cores e descubra combinações harmônicas.</p></header><section class="app"><div id="wheel" class="wheel"><i id="marker"></i></div><div class="info"><div id="preview"></div><h2 id="name">Azul</h2><p id="hex">#3B82F6</p><p id="rgb">rgb(59, 130, 246)</p><p id="hsl">hsl(217, 85%, 55%)</p></div></section><nav id="modes"><button data-mode="complementary" class="active">Complementar</button><button data-mode="analogous">Análoga</button><button data-mode="triadic">Triádica</button><button data-mode="split">Complementar dividida</button><button data-mode="tetradic">Tetrádica</button><button data-mode="mono">Monocromática</button></nav><section><h2 id="title">Complementar</h2><p id="description">Cores opostas na roda cromática para criar alto contraste.</p><div id="palette"></div></section><button id="random">Gerar cor aleatória</button></main><script src="script.js"></script></body></html>
